            "@type": "Question",
            "name": "Aan welke voorwaarden moet ik voldoen om in België een lening aan te vragen?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Om in aanmerking te komen voor een krediet in België moet u: (1) minstens 18 jaar oud zijn, (2) officieel gedomicilieerd zijn in België of het Groothertogdom Luxemburg, (3) beschikken over een regelmatig en aantoonbaar inkomen (loondienst, zelfstandig, pensioen of vervangingsinkomen), en (4) niet geregistreerd staan met een actieve wanbetaling bij de Centrale voor Kredieten aan Particulieren (CKP) van de Nationale Bank van België."
            }
          },
          {
            "@type": "Question",
            "name": "Welke documenten moet ik bezorgen voor de beoordeling van mijn kredietaanvraag?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Voor een vlotte beoordeling hebben we meestal nodig: een kopie van de voor- en achterzijde van uw geldige Belgische identiteitskaart (of geldige verblijfsvergunning), uw 3 meest recente loonfiches (of pensioenoverzichten / recent aanslagbiljet voor zelfstandigen), en een recent bankafschrift waarop uw inkomsten en eventuele huidige vaste lasten zichtbaar zijn."
            }
          },
          {
            "@type": "Question",
            "name": "Wat betekent het JKP (Jaarlijks Kostenpercentage)?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Het Jaarlijks Kostenpercentage (JKP) is de totale wettelijke kostprijs van het krediet voor de consument, uitgedrukt als een jaarlijks percentage van het kredietbedrag. Het omvat zowel de rentevoet als alle eventuele verplichte bijkomende kosten. Bij Snel Krediet is de rentevoet vast gedurende de gehele looptijd, waardoor uw maandbedrag nooit onverwacht stijgt."
            }
          },
          {
            "@type": "Question",
            "name": "Hoe wordt het rentepercentage (JKP) berekend?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Het Jaarlijks Kostenpercentage (JKP) wordt bepaald op basis van het gekozen kredietbedrag, de gewenste looptijd en het type financiering. Bij Snel Krediet is de rentevoet vast gedurende de gehele contractduur, waardoor uw maandlast altijd exact gelijk blijft en u vooraf volledige duidelijkheid heeft."
            }
          },
          {
            "@type": "Question",
            "name": "Kan ik mijn lening vervroegd terugbetalen in België?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ja, op grond van artikel VII.92 van het Belgische Wetboek van economisch recht heeft u te allen tijde het recht om uw krediet geheel of gedeeltelijk vervroegd af te lossen. De wettelijke wederbeleggingsvergoeding is wettelijk begrensd tot maximaal 1% van het terugbetaalde kapitaal (of 0,5% als de resterende looptijd minder dan een jaar bedraagt)."
            }
          },
          {
            "@type": "Question",
            "name": "Wat is het verschil tussen een persoonlijke lening en een hergroepering van kredieten?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Een persoonlijke lening verstrekt nieuw kapitaal voor een specifiek of vrij te bepalen project. Een hergroepering (of consolidatie) voegt bestaande lopende leningen, kredietkaarten en kredietopeningen samen tot één enkele nieuwe lening met één vaste rentevoet en één overzichtelijke maandlast, wat vaak leidt tot meer ademruimte in uw maandbudget."
            }
          },

            }
          }
